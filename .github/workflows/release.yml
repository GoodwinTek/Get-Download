name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Get-Download.psd1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release if version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Import-PowerShellDataFile ./Get-Download.psd1).ModuleVersion
          if (-not $version) { throw "ModuleVersion not found" }
          $tag = "v$version"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, nothing to do"
            exit 0
          }

          gh release create $tag --title "Get-Download $version" --generate-notes --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }